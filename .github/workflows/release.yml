# Builds AllQuest with the BigWigs packager and uploads it.
#
# Pushing a tag (e.g. v1.0.1) uploads to CurseForge (## X-Curse-Project-ID + secret CF_API_KEY), Wago (## X-Wago-ID +
# secret WAGO_API_TOKEN) and GitHub Releases. Tags containing "alpha" or "beta" (e.g. v1.0.1-beta1) are uploaded as alpha / beta files.
#
# Actions tab -> "Package and release" -> "Run workflow" picks the targets by hand:
#   tag      an existing tag to build (e.g. v1.0.0); empty = the newest commit on the chosen branch
#   targets  none (test build: the zip is attached to the run), all, curseforge (only) or wago (only)
#   github   also create / update the GitHub release for that tag
name: Package and release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0). Empty = newest commit (use with 'none' for a test build)"
        required: false
        default: ""
      targets:
        description: "Where to upload"
        type: choice
        options:
          - none
          - all
          - curseforge
          - wago
        default: none
      github:
        description: "Also create/update the GitHub release"
        type: boolean
        default: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Packager switches: -d uploads nothing. WoWInterface is not used (no id, no token); Wago needs ## X-Wago-ID and the WAGO_API_TOKEN secret.
      - name: Choose upload targets
        id: opts
        env:
          EVENT: ${{ github.event_name }}
          TARGETS: ${{ inputs.targets }}
          TAG: ${{ inputs.tag }}
          WAGO_ID: x61xMxN1
        run: |
          args=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$TARGETS" = "none" ]; then
              args="-d"
            elif [ -z "$TAG" ]; then
              echo "::error::Uploading needs a tag (e.g. v1.0.0). Leave targets on 'none' for a test build."
              exit 1
            elif [ "$TARGETS" != "curseforge" ]; then
              # older tags have no ## X-Wago-ID in their TOC, so give the id explicitly
              args="-a $WAGO_ID"
            fi
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Packager arguments: ${args:-(none: upload)}"

      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.opts.outputs.args }}
        env:
          # A site is skipped when its token is empty: a pushed tag uploads everywhere, a manual run only where chosen.
          CF_API_KEY: ${{ (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'curseforge') && secrets.CF_API_KEY || '' }}
          WAGO_API_TOKEN: ${{ (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'wago') && secrets.WAGO_API_TOKEN || '' }}
          # GitHub releases: always for a pushed tag, otherwise only when "github" is ticked
          GITHUB_OAUTH: ${{ (github.event_name == 'push' || inputs.github) && secrets.GITHUB_TOKEN || '' }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: AllQuest-build
          path: .release/*.zip
          include-hidden-files: true # .release/ starts with a dot
